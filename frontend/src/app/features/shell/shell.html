<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/dashboard">
      <span class="brand__mark">I</span>
      <span class="brand__name">ISMA BANK</span>
    </a>

    <button class="burger" type="button" (click)="toggleMenu()" aria-label="Menu">☰</button>

    <nav class="nav" [class.nav--open]="menuOpen()" (click)="menuOpen.set(false)">
      <a routerLink="/dashboard" routerLinkActive="active">Tableau de bord</a>
      <a routerLink="/transfer" routerLinkActive="active">Virement</a>
      <a routerLink="/history" routerLinkActive="active">Historique</a>
      <a routerLink="/account" routerLinkActive="active">Mon compte</a>
    </nav>

    <div class="user">
      @if (account(); as acc) {
        <a class="user__name" routerLink="/account" title="Mon compte">{{ acc.ownerName }}</a>
      }
      <button class="btn btn-ghost btn-sm" type="button" (click)="logout()">Déconnexion</button>
    </div>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
