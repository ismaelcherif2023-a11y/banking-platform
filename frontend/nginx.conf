server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Reverse proxy API (évite tout problème de CORS : même origine) ---

    # Authentification + comptes -> account-service
    location /api/auth/ {
        proxy_pass http://account-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/accounts {
        proxy_pass http://account-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Virements -> transfer-service
    location /api/transfers {
        proxy_pass http://transfer-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Single Page Application : tout le reste renvoie index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets fingerprintés
    location ~* \.(?:js|css|woff2?|ico|png|svg|jpg|jpeg|gif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
